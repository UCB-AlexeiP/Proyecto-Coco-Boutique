<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coco Boutique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">
    <div class="tarjeta-login">
        <h1 class="Titulo-central">Coco Boutique</h1>
        <p class="Decripcion-titulo">Fashion Store</p>
        <p class="Instruccion Instruccion-principal">Ingresa a tu cuenta</p>

        <p class="login-error" id="login-error"></p>

        <form id="form-login">
            <p class="Campo-formulario campo-usuario">
                Usuario:
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
            </p>
            <p class="Campo-formulario campo-password">
                Contraseña:
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
            </p>
            <button type="submit" class="boton-login">Iniciar Sesión</button>
        </form>

        <p class="Instruccion">¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
        <p class="Instruccion">¿Olvidaste tu contraseña? <a href="#">Recupérala aquí</a></p>

        <p class="login-demo-hint">usuario <strong>admin</strong> · contraseña <strong>coco2026</strong></p>
    </div>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
